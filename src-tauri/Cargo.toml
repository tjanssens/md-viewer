[package]
name = "md-viewer"
version = "2.0.3"
description = "Fast Markdown viewer and editor"
edition = "2021"
license = "MIT"

[lib]
name = "md_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = { version = "0.39", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
ammonia = "4"
notify = "8"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
